# DANBOY: nginx, web (2 replika), worker, redis, mongo (replica set rs0).
# Jalankan dari folder deploy/:  docker compose --env-file .env up -d
# MongoDB dan Redis hanya ada di jaringan internal; satu-satunya port terbuka adalah 443 (dan 80 untuk redirect).

name: danboy

x-app-env: &app-env
  MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/danboy?replicaSet=rs0&authSource=danboy
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL}
  AUTH_TRUST_HOST: 'true'
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
  AMBANG_MENDEKATI_PERSEN: ${AMBANG_MENDEKATI_PERSEN:-90}
  TZ: Asia/Jakarta
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SANDI_AWAL: ${SANDI_AWAL:-}

services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./tls}:/etc/nginx/tls:ro
    depends_on: [web]
    networks: [publik, internal]

  web:
    image: danboy-web:${VERSI:-1.0.0}
    restart: unless-stopped
    environment: *app-env
    deploy:
      replicas: 2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    image: danboy-worker:${VERSI:-1.0.0}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # mongod menolak keyfile yang bukan milik user mongodb (999) dengan izin 400; salin dulu ke dalam container
    entrypoint:
      - bash
      - -c
      - cp /etc/mongo-src/keyfile /etc/mongo-keyfile && chown 999:999 /etc/mongo-keyfile && chmod 400 /etc/mongo-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-keyfile:/etc/mongo-src/keyfile:ro
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '-u', '${MONGO_ROOT_USER}', '-p', '${MONGO_ROOT_PASSWORD}', '--authenticationDatabase', 'admin', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  mongo-data:
  redis-data:

networks:
  publik:
  internal:
    internal: true
